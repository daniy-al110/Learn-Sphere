<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login & Signup - Learning Sphere</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#F72263',
            accent: '#F72263',
            sidebar: '#1A1A2E'
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: #1A1A2E;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 550px;
      background: #FFFFFF;
      border-radius: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .form-container {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      transition: all 0.6s ease-in-out;
    }

    .signup-container {
      left: 0;
      opacity: 0;
      z-index: 1;
    }

    .login-container {
      left: 0;
      opacity: 1;
      z-index: 2;
    }

    .auth-container.signup-mode .signup-container {
      opacity: 1;
      z-index: 5;
      transform: translateX(100%);
    }

    .auth-container.signup-mode .login-container {
      opacity: 0;
      z-index: 1;
    }

    .overlay-container {
      position: absolute;
      top: 0;
      left: 50%;
      width: 50%;
      height: 100%;
      overflow: hidden;
      transition: transform 0.6s ease-in-out;
      z-index: 100;
    }

    .auth-container.signup-mode .overlay-container {
      transform: translateX(-100%);
    }

    .overlay {
      position: relative;
      background: #F72263;
      color: #FFFFFF;
      left: -100%;
      height: 100%;
      width: 200%;
      transform: translateX(0);
      transition: transform 0.6s ease-in-out;
    }

    .auth-container.signup-mode .overlay {
      transform: translateX(50%);
    }

    .overlay-panel {
      position: absolute;
      top: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      height: 100%;
      width: 50%;
      text-align: center;
      transition: transform 0.6s ease-in-out;
    }

    .overlay-left {
      transform: translateX(-20%);
    }

    .auth-container.signup-mode .overlay-left {
      transform: translateX(0);
    }

    .overlay-right {
      right: 0;
      transform: translateX(0);
    }

    .auth-container.signup-mode .overlay-right {
      transform: translateX(20%);
    }

    .auth-input {
      width: 100%;
      padding: 12px 16px;
      margin: 8px 0;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      outline: none;
      transition: all 0.3s;
      font-size: 14px;
      background: #FFFFFF;
      color: #1A1A2E;
    }

    .auth-input:focus {
      border-color: #F72263;
      box-shadow: 0 0 0 3px rgba(247, 34, 99, 0.15);
    }

    .auth-btn {
      width: 100%;
      padding: 12px;
      margin-top: 16px;
      background: #F72263;
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .auth-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(247, 34, 99, 0.4);
      opacity: 0.9;
    }

    .ghost-btn {
      background: transparent;
      border: 2px solid #FFFFFF;
      color: #FFFFFF;
      padding: 12px 40px;
      border-radius: 25px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 20px;
    }

    .ghost-btn:hover {
      background: #FFFFFF;
      color: #F72263;
    }

    h2 {
      color: #1A1A2E;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .overlay h2 {
      color: #FFFFFF;
      font-size: 32px;
      margin-bottom: 10px;
    }

    .overlay p {
      color: #FFFFFF;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 20px;
      opacity: 0.95;
    }

    select.auth-input {
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .form-container {
        width: 100%;
      }

      .overlay-container {
        display: none;
      }

      /* Mobile specific toggle behavior */
      .auth-container.signup-mode .signup-container {
        transform: translateX(0);
        opacity: 1;
        z-index: 5;
      }

      .auth-container.signup-mode .login-container {
        opacity: 0;
        z-index: 1;
      }
    }
  </style>
</head>

<body>
  <div class="auth-container" id="authContainer">
    <!-- Login Form -->
    <div class="form-container login-container">
      <form class="w-full" id="loginForm">
        <h2 class="text-3xl mb-6">Log In</h2>

        <select class="auth-input" id="loginRole" required>
          <option value="">Select Role</option>
          <option value="student">Student</option>
          <option value="teacher">Teacher</option>
          <option value="admin">Admin</option>
        </select>

        <input type="email" class="auth-input" id="loginEmail" placeholder="Email" required />
        <input type="password" class="auth-input" id="loginPassword" placeholder="Password" required />

        <button type="submit" class="auth-btn">LOG IN</button>
        <p class="md:hidden mt-4 text-center text-gray-600">
          Don't have an account? <a href="#" id="mobileSignupBtn" class="font-bold" style="color: #F72263;">Sign up</a>
        </p>
      </form>
    </div>

    <!-- Signup Form -->
    <div class="form-container signup-container">
      <form class="w-full" id="signupForm">
        <h2 class="text-3xl mb-6">Create Account</h2>

        <input type="text" class="auth-input" id="signupName" placeholder="Full Name" required />
        <input type="email" class="auth-input" id="signupEmail" placeholder="Email" required />
        <input type="password" class="auth-input" id="signupPassword" placeholder="Password" required />
        <input type="password" class="auth-input" id="confirmPassword" placeholder="Confirm Password" required />

        <button type="submit" class="auth-btn">SIGN UP</button>
        <p class="md:hidden mt-4 text-center text-gray-600">
          Already have an account? <a href="#" id="mobileLoginBtn" class="font-bold" style="color: #F72263;">Log in</a>
        </p>
      </form>
    </div>

    <!-- Overlay Panel -->
    <div class="overlay-container">
      <div class="overlay">
        <!-- Left Overlay (visible in signup mode) -->
        <div class="overlay-panel overlay-left">
          <h2>Welcome Back!</h2>
          <p>To keep connected with us please login with your personal info</p>
          <button class="ghost-btn" id="loginBtn">LOG IN</button>
        </div>

        <!-- Right Overlay (visible in login mode) -->
        <div class="overlay-panel overlay-right">
          <h2>Hello, Friend!</h2>
          <p>Enter your personal details and start your journey with us</p>
          <button class="ghost-btn" id="signupBtn">SIGN UP</button>
        </div>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
  <script>
    const authContainer = document.getElementById('authContainer');
    const signupBtn = document.getElementById('signupBtn');
    const loginBtn = document.getElementById('loginBtn');

    signupBtn.addEventListener('click', () => {
      authContainer.classList.add('signup-mode');
    });

    loginBtn.addEventListener('click', () => {
      authContainer.classList.remove('signup-mode');
    });

    // Mobile toggle handlers
    const mobileSignupBtn = document.getElementById('mobileSignupBtn');
    const mobileLoginBtn = document.getElementById('mobileLoginBtn');

    if (mobileSignupBtn) {
      mobileSignupBtn.addEventListener('click', (e) => {
        e.preventDefault();
        authContainer.classList.add('signup-mode');
      });
    }

    if (mobileLoginBtn) {
      mobileLoginBtn.addEventListener('click', (e) => {
        e.preventDefault();
        authContainer.classList.remove('signup-mode');
      });
    }

    // Form submissions 
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      console.log('Login form submitted');
    });

    document.getElementById('signupForm').addEventListener('submit', (e) => {
      e.preventDefault();
      console.log('Signup form submitted');
    });
  </script>
</body>

</html>
